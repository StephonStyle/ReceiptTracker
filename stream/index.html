<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>光影流媒体</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== LOGIN PAGE ===== -->
<div id="page-login" class="page active">
  <div class="login-bg"></div>
  <div class="login-container">
    <div class="login-icon">🎬</div>
    <h1 class="login-title" id="loginTitle">光影流媒体</h1>
    <p class="login-subtitle">私人影音中心</p>
    <div class="login-form">
      <input type="text" id="serverUrl" class="login-input login-server" placeholder="服务器地址 (如 192.168.1.100:8080)">
      <input type="password" id="loginPassword" class="login-input" placeholder="请输入密码" autocomplete="current-password">
      <button class="login-btn" id="loginBtn" onclick="doLogin()">进 入</button>
    </div>
    <p id="loginError" class="login-error"></p>
  </div>
</div>

<!-- ===== LIBRARY PAGE ===== -->
<div id="page-library" class="page">
  <div class="lib-header">
    <h1 class="lib-title" id="libTitle">光影流媒体</h1>
    <button class="lib-refresh" onclick="loadLibrary()" title="刷新">↻</button>
    <button class="lib-refresh" onclick="changeServer()" title="切换服务器">⚡</button>
  </div>

  <div id="libContent" class="lib-content">
    <div class="loading-screen">
      <div class="spinner"></div>
      <p>正在加载...</p>
    </div>
  </div>

  <div class="lib-footer">
    <span id="libFooterText"></span>
  </div>
</div>

<!-- ===== PLAYER PAGE ===== -->
<div id="page-player" class="page">
  <div class="player-top">
    <button class="player-back" onclick="goBack()">‹</button>
    <div class="player-title" id="playerTitle">正在播放</div>
  </div>

  <div class="player-container" id="playerContainer">
    <video id="videoPlayer" class="video-player" playsinline webkit-playsinline
           preload="metadata"
           onloadedmetadata="onVideoMeta()"
           ontimeupdate="onTimeUpdate()"
           onended="onVideoEnded()"
           onerror="onVideoError()"
           onclick="onVideoTap(event)"
           ontouchstart="onTouchStart(event)"
           ontouchend="onTouchEnd(event)"
           ontouchmove="onTouchMove(event)">
    </video>

    <!-- Touch overlay for controls -->
    <div class="touch-overlay" id="touchOverlay">
      <div class="touch-left" id="touchLeft">
        <span class="touch-icon" id="rewindIcon">↩</span>
        <span class="touch-hint" id="rewindHint">-10s</span>
      </div>
      <div class="touch-center" id="touchCenter">
        <span class="play-icon" id="playIcon">▶</span>
      </div>
      <div class="touch-right" id="touchRight">
        <span class="touch-icon" id="forwardIcon">↪</span>
        <span class="touch-hint" id="forwardHint">+10s</span>
      </div>
    </div>

    <!-- Progress bar -->
    <div class="progress-bar" id="progressBar"
         onclick="onProgressTap(event)"
         ontouchstart="onProgressTouchStart(event)"
         ontouchmove="onProgressTouchMove(event)">
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-thumb" id="progressThumb"></div>
      </div>
      <div class="progress-time">
        <span id="currentTime">00:00</span>
        <span id="duration">00:00</span>
      </div>
    </div>

    <!-- Top controls (fullscreen, back) -->
    <div class="player-controls">
      <button class="ctrl-btn" onclick="togglePlay()">
        <span id="ctrlPlayIcon">⏸</span>
      </button>
      <button class="ctrl-btn" onclick="goFullscreen()">⛶</button>
    </div>
  </div>

  <!-- Episode list -->
  <div class="episode-bar" id="episodeBar">
    <div class="episode-header">
      <span>剧集列表</span>
      <span class="episode-count" id="episodeCount"></span>
    </div>
    <div class="episode-list" id="episodeList"></div>
  </div>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="js/app.js"></script>
</body>
</html>
